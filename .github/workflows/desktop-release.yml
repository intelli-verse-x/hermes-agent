# desktop-release.yml — branded desktop release chain (fork-only; upstream
# hermes-agent has no packaged-release CI). Full docs: apps/desktop/RELEASING.md
#
# One repo ships THREE branded desktop apps (IX Agency + QuizVerse + Foundrly) from the
# same Hermes core — the build matrix is 3 brands x 3 OS. DESKTOP_BRAND
# selects the flavor (apps/desktop/brands/<brand>.json owns the identity).
#
# Triggers:
#   - automatically from desktop-auto-release.yml on every merge to main that
#     bumps apps/desktop/package.json version (workflow_call),
#   - push an `ix-desktop-v*` tag whose version matches
#     apps/desktop/package.json (e.g. ix-desktop-v0.17.0) — releases BOTH
#     brands at that version,
#   - or run manually (workflow_dispatch).
#
# Each job builds with electron-builder and publishes DIRECTLY to the brand's
# S3 prefix (s3://intelliverse-x-desktop/ix-agency/ or .../quizverse/, from
# the brand overlay in build/electron-builder-brand.json): installers +
# per-platform channel files (latest.yml / latest-mac.yml / latest-linux.yml).
# Installed apps poll their own brand's feed with electron-updater's generic
# provider (electron/ix-updater.ts) — the "Update available" button pops up
# within 4 h and installs in place.
#
# AWS publishing uses short-lived GitHub OIDC credentials from the
# github-actions-desktop-release role. No long-lived AWS keys are required.
# Optional (macOS signing + notarization; unsigned builds still publish, but
# mac in-place auto-update needs a signed app — unsigned falls back to
# opening the .dmg URL):
#   CSC_LINK / CSC_KEY_PASSWORD — Developer ID cert (base64 .p12 / password)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID — notarytool
# Optional (Windows Authenticode via SSL.com eSigner cloud signing; unsigned
# builds still publish, but SmartScreen shows "Unknown publisher"):
#   ES_USERNAME / ES_PASSWORD — SSL.com account (sales@intelli-verse-x.ai)
#   ES_TOTP_SECRET            — eSigner OTP secret (text under the QR code)
#   ES_CREDENTIAL_ID          — eSigner signing credential UUID
# When all four exist, the Windows job downloads SSL.com CodeSignTool and
# re-enables win.signAndEditExecutable + a custom sign hook
# (apps/desktop/scripts/esigner-sign.mjs) via -c overrides, so the exe and
# installers are signed INSIDE electron-builder and latest.yml checksums stay
# valid. package.json keeps signAndEditExecutable=false for local builds
# (winCodeSign extraction fails on non-admin Windows — see set-exe-identity.mjs).
name: desktop-release

permissions:
  contents: read
  id-token: write

on:
  push:
    tags: ["ix-desktop-v*"]
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
        brand: [ix-agency, quizverse, foundrly]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    env:
      DESKTOP_BRAND: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::970547373533:role/github-actions-desktop-release
          role-session-name: desktop-release-${{ matrix.brand }}-${{ github.run_id }}
          aws-region: us-east-1

      - name: Linux packaging deps (rpm for the rpm target)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # SSL.com CodeSignTool (Windows Authenticode via eSigner cloud signing).
      # Java for the tool + pinned CodeSignTool release; only when the ES_*
      # secrets exist — forks and unsigned releases skip both steps.
      - uses: actions/setup-java@v4
        if: matrix.platform == 'windows-latest' && secrets.ES_USERNAME != ''
        with:
          distribution: temurin
          java-version: 17

      - name: Download SSL.com CodeSignTool
        if: matrix.platform == 'windows-latest' && secrets.ES_USERNAME != ''
        run: |
          curl -fsSL -o /tmp/CodeSignTool.zip \
            https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip
          unzip -q /tmp/CodeSignTool.zip -d "$RUNNER_TEMP/codesigntool"
          # The zip may nest a single top-level dir; resolve to the dir that
          # actually contains jar/ so CODE_SIGN_TOOL_PATH is always right.
          TOOL_DIR="$(dirname "$(find "$RUNNER_TEMP/codesigntool" -name '*.jar' -path '*/jar/*' | head -1)")"
          TOOL_DIR="$(dirname "$TOOL_DIR")"
          echo "CODE_SIGN_TOOL_PATH=$TOOL_DIR" >> "$GITHUB_ENV"
          echo "CodeSignTool at: $TOOL_DIR"

      - name: Guard — tag version must match apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/ix-desktop-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ix-desktop-v}"
          PKG_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME is v$TAG_VERSION but apps/desktop is v$PKG_VERSION" >&2
            exit 1
          fi

      - run: npm ci

      - name: Typecheck + brand unit tests
        working-directory: apps/desktop
        run: |
          npx tsc -p . --noEmit
          npx tsx --test electron/ix-updater.test.ts electron/ix-status.test.ts electron/qv-deeptutor.test.ts
          npm run test:local-ai
          npm run test:governed-voice
          npm run test:release-auth
          npx vitest run --environment jsdom src/components/local-ai-setup-overlay.test.tsx src/components/assistant-ui/tool/approval.test.tsx src/store/prompts.test.ts src/store/local-ai.test.ts

      - name: Test governed local routing and computer use
        run: >-
          uv run --with pytest pytest -q
          tests/test_adaptive_local_client.py
          tests/tools/test_voice_privacy.py
          tests/tools/test_computer_use.py::TestGovernedApproval
          tests/tui_gateway/test_voice_attestation.py

      - name: Build renderer + electron bundles
        working-directory: apps/desktop
        run: npm run build

      - name: Assert brand separation in the built bundles
        working-directory: apps/desktop
        run: node scripts/check-brand-separation.mjs

      - name: Package locally for verification
        working-directory: apps/desktop
        env:
          # macOS signing/notarization (skipped when unset; CSC_IDENTITY_AUTO_DISCOVERY
          # avoids electron-builder hunting a keychain identity that isn't there).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          # Windows Authenticode via SSL.com eSigner (scripts/esigner-sign.mjs;
          # skipped when unset).
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
        # Unset EMPTY signing vars: electron-builder treats an empty CSC_LINK
        # as a certificate *path* and dies with "<cwd> not a file".
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID ES_USERNAME ES_PASSWORD ES_TOTP_SECRET ES_CREDENTIAL_ID; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          SIGN_ARGS=()
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "${ES_USERNAME:-}" ]; then
            # CI-only override: package.json keeps signAndEditExecutable=false
            # because winCodeSign extraction fails on non-admin Windows (see
            # set-exe-identity.mjs) — CI runners are admin, so it's safe here.
            SIGN_ARGS=(-c.win.signAndEditExecutable=true -c.win.signtoolOptions.sign=scripts/esigner-sign.mjs)
          fi
          npm run builder -- --publish never "${SIGN_ARGS[@]}"

      - name: Verify unpacked app payload resources (not installer container)
        working-directory: apps/desktop
        env:
          HERMES_DESKTOP_SKIP_BUILD: "1"
        run: node scripts/test-desktop.mjs all

      - name: Inspect and smoke platform release artifacts
        working-directory: apps/desktop
        run: npm run verify:platform-artifacts

      - name: Validate packaged macOS restart rehydration
        if: matrix.platform == 'macos-latest'
        working-directory: apps/desktop
        run: npx tsx --test --test-name-pattern "packaged restart rehydrates" electron/local-ai/attempt-loop.test.ts

      - name: Publish verified package to S3 feed
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID ES_USERNAME ES_PASSWORD ES_TOTP_SECRET ES_CREDENTIAL_ID; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          SIGN_ARGS=()
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "${ES_USERNAME:-}" ]; then
            SIGN_ARGS=(-c.win.signAndEditExecutable=true -c.win.signtoolOptions.sign=scripts/esigner-sign.mjs)
          fi
          npm run builder -- --publish always "${SIGN_ARGS[@]}"

      - name: Upload installers as workflow artifacts (debug/QA convenience)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.brand }}-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/latest*.yml
          if-no-files-found: warn

  # Publish the download landing page to the bucket root on every release.
  # The page fetches ix-agency/latest-*.yml at runtime so it always shows the
  # newest version without republishing — this step just makes sure edits to
  # apps/desktop/download-site/index.html ship automatically too.
  publish-download-page:
    needs: build-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::970547373533:role/github-actions-desktop-release
          role-session-name: desktop-download-page-${{ github.run_id }}
          aws-region: us-east-1
      - name: Upload download-site/index.html to s3://intelliverse-x-desktop/index.html
        run: |
          aws s3 cp apps/desktop/download-site/index.html s3://intelliverse-x-desktop/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"
          # Foundrly-only share page (no Agency/QuizVerse tabs) — client handover URL
          aws s3 cp apps/desktop/download-site/foundrly.html s3://intelliverse-x-desktop/foundrly/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"
          aws s3 cp apps/desktop/download-site/foundrly.html s3://intelliverse-x-desktop/foundrly.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"
          curl -sf https://intelliverse-x-desktop.s3.amazonaws.com/index.html >/dev/null
          curl -sf https://intelliverse-x-desktop.s3.amazonaws.com/foundrly/index.html >/dev/null

  # End-to-end feed check: after all platforms publish, confirm each brand's
  # public S3 feed serves the new version on every channel and every artifact
  # it references is downloadable with the exact size the channel file records.
  verify-feed:
    needs: build-publish
    strategy:
      fail-fast: false
      matrix:
        brand: [ix-agency, quizverse, foundrly]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the ${{ matrix.brand }} update feed serves this version
        env:
          DESKTOP_BRAND: ${{ matrix.brand }}
        run: |
          EXPECT_VERSION="$(node -p "require('./apps/desktop/package.json').version")" \
            node apps/desktop/scripts/verify-update-feed.mjs
